      x-user-stories: [US-S03]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The questions; an answer is the position of the chosen option (0, 1 or 2)
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions: { type: array, items: { type: object, properties: { question: { type: string }, options: { type: array, items: { type: string } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/students/me/quiz:
    post:
      tags: [Student]
      summary: Take the level quiz for one topic
      description: 'Score 0 to 3 is beginner, 4 to 7 intermediate, 8 to 10 advanced. Taking it again replaces the old result. Smart Match shows and uses the level.'
      x-user-stories: [US-S03]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, answers]
              properties:
                topic: { type: string }
                answers: { type: array, items: { type: integer, minimum: 0, maximum: 2 } }
