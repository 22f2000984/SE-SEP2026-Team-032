7">+ verifyMentorProfile()</text><text x="1572" y="488" font-size="13" font-weight="400" fill="#243447">+ proposeMatch(s, m): Match</text><text x="1572" y="508" font-size="13" font-weight="400" fill="#243447">+ changeStatus(m, status)</text><text x="1572" y="528" font-size="13" font-weight="400" fill="#243447">+ viewOverview()</text><text x="1572" y="548" font-size="13" font-weight="400" fill="#243447">+ resolveConcern()</text><rect x="680" y="800" width="440" height="266" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M680,834 V806 Q680,800 686,800 H1114 Q1120,800 1120,806 V834 Z" fill="#12345a"/><text x="900.0" y="823" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Match</text><text x="692" y="854" font-size="13" font-weight="400" fill="#243447">- matchId: int</text><text x="692" y="874" font-size="13" font-weight="400" fill="#243447">- status: MatchStatus</text><text x="692" y="894" font-size="13" font-weight="400" fill="#243447">- notes: string</text><text x="692" y="914" font-size="13" font-weight="400" fill="#243447">- proposedAt: datetime</text><text x="692" y="934" font-size="13" font-weight="400" fill="#243447">- respondedAt: datetime</text><line x1="680" y1="946" x2="1120" y2="946" stroke="#1769aa"/><text x="692" y="968" font-size="13" font-weight="400" fill="#243447">+ confirm()</text><text x="692" y="988" font-size="13" font-weight="400" fill="#243447">+ decline()</text><text x="692" y="1008" font-size="13" font-weight="400" fill="#243447">+ activate()</text><text x="692" y="1028" font-size="13" font-weight="400" fill="#243447">+ complete()</text><text x="692" y="1048" font-size="13" font-weight="400" fill="#243447">+ cancel()</text><polyline points="250.0,380 250.0,352 900.0,352 900.0,322" fill="none" stroke="#243447" stroke-width="1.6" marker-end="url(#tri)"/><polyline points="900.0,380 900.0,322" fill="none" stroke="#243447" stroke-width="1.6" marker-end="url(#tri)"/><polyline points="1740.0,380 1740.0,352 900.0,352 900.0,322" fill="none" stroke="#243447" stroke-width="1.6" marker-end="url(#tri)"/><polyline points="1120,520 1200,520" fill="none" stroke="#243447" stroke-width="1.6"/><text x="1136" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="1184" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="250.0,666 250.0,890 680,890" fill="none" stroke="#243447" stroke-width="1.6"/><text x="262.0" y="684" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="664" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="900.0,646 900.0,800" fill="none" stroke="#243447" stroke-width="1.6"/><text x="912.0" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="912.0" y="782" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="1740.0,566 1740.0,890 1120,890" fill="none" stroke="#243447" stroke-width="1.6"/><text x="1752.0" y="584" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="1136" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><text x="266.0" y="880" text-anchor="start" font-size="12" fill="#243447" font-style="italic">is matched in</text><text x="1724.0" y="880" text-anchor="end" font-size="12" fill="#243447" font-style="italic">proposes</text><rect x="40" y="1160" width="400" height="132" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M40,1194 V1166 Q40,1160 46,1160 H434 Q440,1160 440,1166 V1194 Z" fill="#12345a"/><text x="240.0" y="1183" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Feedback</text><text x="52" y="1214" font-size="13" font-weight="400" fill="#243447">- feedbackId: int</text><text x="52" y="1234" font-size="13" font-weight="400" fill="#243447">- rating: int</text><text x="52" y="1254" font-size="13" font-weight="400" fill="#243447">- comments: string</text><text x="52" y="1274" font-size="13" font-weight="400" fill="#243447">- createdAt: datetime</text><rect x="520" y="1160" width="400" height="132" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M520,1194 V1166 Q520,1160 526,1160 H914 Q920,1160 920,1166 V1194 Z" fill="#12345a"/><text x="720.0" y="1183" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Concern</text><text x="532" y="1214" font-size="13" font-weight="400" fill="#243447">- concernId: int</text><text x="532" y="1234" font-size="13" font-weight="400" fill="#243447">- description: string</text><text x="532" y="1254" font-size="13" font-weight="400" fill="#243447">- status: ConcernStatus</text><text x="532" y="1274" font-size="13" font-weight="400" fill="#243447">- createdAt: datetime</text><rect x="1000" y="1160" width="400" height="132" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M1000,1194 V1166 Q1000,1160 1006,1160 H1394 Q1400,1160 1400,1166 V1194 Z" fill="#12345a"/><text x="1200.0" y="1183" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Notification</text><text x="1012" y="1214" font-size="13" font-weight="400" fill="#243447">- notificationId: int</text><text x="1012" y="1234" font-size="13" font-weight="400" fill="#243447">- message: string</text><text x="1012" y="1254" font-size="13" font-weight="400" fill="#243447">- channel: string</text><text x="1012" y="1274" font-size="13" font-weight="400" fill="#243447">- isRead: bool</text><rect x="1500" y="1160" width="400" height="168" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M1500,1210 V1166 Q1500,1160 1506,1160 H1894 Q1900,1160 1900,1166 V1210 Z" fill="#1769aa"/><text x="1700.0" y="1177" text-anchor="middle" font-size="12" fill="#cfe3f5" font-style="italic">&lt;&lt;enumeration&gt;&gt;</text><text x="1700.0" y="1199" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MatchStatus</text><text x="1512" y="1230" font-size="13" font-weight="400" fill="#243447">proposed</text><text x="1512" y="1250" font-size="13" font-weight="400" fill="#243447">confirmed</text><text x="1512" y="1270" font-size="13" font-weight="400" fill="#243447">active</text><text x="1512" y="1290" font-size="13" font-weight="400" fill="#243447">completed</text><text x="1512" y="1310" font-size="13" font-weight="400" fill="#243447">cancelled</text><polyline points="900.0,1066 900.0,1120 240.0,1120 240.0,1160" fill="none" stroke="#243447" stroke-width="1.6"/><text x="252.0" y="1142" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1..*</text><polyline points="900.0,1066 900.0,1120 720.0,1120 720.0,1160" fill="none" stroke="#243447" stroke-width="1.6"/><text x="732.0" y="1142" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="900.0,1066 900.0,1120 1200.0,1120 1200.0,1160" fill="none" stroke="#243447" stroke-width="1.6"/><text x="1212.0" y="1142" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="1120,1020 1700.0,1020 1700.0,1160" fill="none" stroke="#243447" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="1690.0" y="1008" text-anchor="end" font-size="12" fill="#243447" font-style="italic">uses</text><text x="980" y="1390" text-anchor="middle" font-size="13" fill="#243447" font-style="italic">Students and mentors never browse each other: every Match is proposed by an Administrator, who tracks its status.</text></svg>