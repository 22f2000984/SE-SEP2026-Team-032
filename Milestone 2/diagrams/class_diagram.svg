<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1420" viewBox="0 0 1960 1420" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#fff" stroke="#243447" stroke-width="1.4"/></marker><marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#243447" stroke-width="1.6"/></marker></defs><text x="40" y="42" font-size="26" font-weight="700" fill="#12345a">Class Diagram: Student Mentoring Platform (client-mediated)</text><rect x="700" y="80" width="400" height="242" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M700,130 V86 Q700,80 706,80 H1094 Q1100,80 1100,86 V130 Z" fill="#12345a"/><text x="900.0" y="97" text-anchor="middle" font-size="12" fill="#cfe3f5" font-style="italic">&lt;&lt;abstract&gt;&gt;</text><text x="900.0" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">User</text><text x="712" y="150" font-size="13" font-weight="400" fill="#243447">- userId: int</text><text x="712" y="170" font-size="13" font-weight="400" fill="#243447">- email: string</text><text x="712" y="190" font-size="13" font-weight="400" fill="#243447">- passwordHash: string</text><text x="712" y="210" font-size="13" font-weight="400" fill="#243447">- fullName: string</text><text x="712" y="230" font-size="13" font-weight="400" fill="#243447">- role: Role</text><line x1="700" y1="242" x2="1100" y2="242" stroke="#1769aa"/><text x="712" y="264" font-size="13" font-weight="400" fill="#243447">+ login(): Token</text><text x="712" y="284" font-size="13" font-weight="400" fill="#243447">+ logout()</text><text x="712" y="304" font-size="13" font-weight="400" fill="#243447">+ updateAccount()</text><rect x="40" y="380" width="420" height="366" rx="6" fill="#f4f7fb" stroke="#1