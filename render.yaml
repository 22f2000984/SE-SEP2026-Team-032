# Render blueprint: creates the backend web service from this repo.
# Free plan: the service sleeps when idle. Set DATABASE_URL (Supabase) so the data survives restarts.
# Variables marked 'sync: false' are typed in the Render dashboard and never stored in git.
services:
  - type: web
    name: mentor-connect-api
    runtime: python
    plan: free
    rootDir: Milestone 3/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LOAD_DEMO_DATA
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: JOBS_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
