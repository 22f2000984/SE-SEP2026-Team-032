 font-weight="400" fill="#243447">+ decline()</text><text x="692" y="1008" font-size="13" font-weight="400" fill="#243447">+ complete()</text><text x="692" y="1028" font-size="13" font-weight="400" fill="#243447">+ cancel()</text><polyline points="250.0,380 250.0,352 900.0,352 900.0,322" fill="none" stroke="#243447" stroke-width="1.6" marker-end="url(#tri)"/><polyline points="900.0,380 900.0,322" fill="none" stroke="#243447" stroke-width="1.6" marker-end="url(#tri)"/><polyline points="1740.0,380 1740.0,352 900.0,352 900.0,322" fill="none" stroke="#243447" stroke-width="1.6" marker-end="url(#tri)"/><polyline points="1120,520 1200,520" fill="none" stroke="#243447" stroke-width="1.6"/><text x="1136" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="1184" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="250.0,746 250.0,890 680,890" fill="none" stroke="#243447" stroke-width="1.6"/><text x="262.0" y="764" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="664" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="900.0,626 900.0,800" fill="none" stroke="#243447" stroke-width="1.6"/><text x="912.0" y="644" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="912.0" y="782" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><polyline points="1740.0,626 1740.0,890 1120,890" fill="none" stroke="#243447" stroke-width="1.6"/><text x="1752.0" y="644" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">1</text><text x="1136" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#1769aa">0..*</text><text x="266.0" y="880" text-anchor="start" font-size="12" fill="#243447" font-style="italic">is matched in</text><text x="1724.0" y="880" text-anchor="end" font-size="12" fill="#243447" font-style="italic">proposes</text><rect x="40" y="1160" width="320" height="132" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M40,1194 V1166 Q40,1160 46,1160 H354 Q360,1160 360,1166 V1194 Z" fill="#12345a"/><text x="200.0" y="1183" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Feedback</text><text x="52" y="1214" font-size="13" font-weight="400" fill="#243447">- feedbackId: int</text><text x="52" y="1234" font-size="13" font-weight="400" fill="#243447">- rating: int</text><text x="52" y="1254" font-size="13" font-weight="400" fill="#243447">- comments: string</text><text x="52" y="1274" font-size="13" font-weight="400" fill="#243447">- createdAt: datetime</text><rect x="420" y="1160" width="320" height="132" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M420,1194 V1166 Q420,1160 426,1160 H734 Q740,1160 740,1166 V1194 Z" fill="#12345a"/><text x="580.0" y="1183" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Concern</text><text x="432" y="1214" font-size="13" font-weight="400" fill="#243447">- concernId: int</text><text x="432" y="1234" font-size="13" font-weight="400" fill="#243447">- description: string</text><text x="432" y="1254" font-size="13" font-weight="400" fill="#243447">- status: ConcernStatus</text><text x="432" y="1274" font-size="13" font-weight="400" fill="#243447">- createdAt: datetime</text><rect x="800" y="1160" width="320" height="132" rx="6" fill="#f4f7fb" stroke="#1769aa" stroke-width="2"/><path d="M800,1194 V1166 Q800,1160 806,1160 H1114 Q1120,1160 1120,1166 V1194 Z" fill="#12345a"/><text x="960.0" y="1183" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Notification</text><text x="812" y="1214" font-size="13" font-weight="400" fill="#243447">- notificationId: int</text><text x="812" y="1234" font-size="13" font-weight="400" fill="#243447">- message: string</text><text x="812" y="1254" font-size="13" font-weight="400" fill="#243447">- isRead: bool</text><text x="812" y="1