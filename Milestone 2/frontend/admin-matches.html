<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matches · Mentor Connect</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"></main><script src="app.js"></script><script>const u = guard('admin'), app = document.getElementById('app');
function draw() {
  const d = load(), students = d.users.filter(x => x.role === 'student'), mentors = d.users.filter(x => x.role === 'mentor' && d.mentors[x.id].status === 'verified');
  app.innerHTML = `<div class="eyebrow">Coordinator</div><h1>Matches</h1>
  <div class="card"><h2>Propose a match</h2><p class="muted">Both the mentor and the student are notified. You can confirm the match only after both have accepted, or you can cancel it.</p><form id="f"><div class="row"><div><label for="s">Student</label><select id="s">${students.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
  <div><label for="m">Verified mentor</label><select id="m">${mentors.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div>
  <div id="cmp"></div><label for="n">Notes (the basis for this match)</label><input id="n" placeholder="Why this pairing?"><div class="err" id="err"></div><div class="actions"><button class="btn" type="submit">Propose match</button></div></form></div>
  <h2 style="margin-top:24px">All matches</h2><div class="table-wrap"><table><tr><th>Student</th><th>Mentor</th><th>Status</th><th>Mentor response</th><th>Student response</th><th>Proposed</th><th>Action</th></tr>${d.matches.map(m => `<tr><td>${esc(userName(d, m.studentId))}</td><td>${esc(userName(d, m.mentorId))}</td><td>${pill(m.status)}<br><span class="muted">${m.log.length} update(s)</span></td><td>${m.status === 'proposed' ? `${pill(m.mentorResponse)}${m.mentorRespondedAt ? `<br><span class="muted">${when(m.mentorRespondedAt)}</span>` : ''}` : '<span class="muted">-</span>'}</td><td>${m.status === 'proposed' ? `${pill(m.studentResponse)}${m.studentRespondedAt ? `<br><span class="muted">${when(m.studentRespondedAt)}</span>` : ''}` : '<span class="muted">-</span>'}</td><td>${when(m.proposedAt)}</td>
  <td>${m.status === 'proposed' ? `<div class="actions"><button class="btn small" data-ok="${m.id}" ${bothAccepted(m) ? '' : 'disabled title="Both sides must accept first"'}>Confirm match</button><button class="btn small danger" data-no="${m.id}">Cancel</button></div>` : NEXT[m.status].length ? `<select data-m="${m.id}"><option value="">Choose…</option>${NEXT[m.status].map(s => `<option>${s}</option>`).join('')}</select>` : '<span class="muted">Final</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No matches yet.</td></tr>'}</table></div>`;
  const compare = () => {
    const sid = +document.getElementById('s').value, mid = +document.getElementById('m').value, sp = d.students[sid], mp = d.mentors[mid];
    document.getElementById('cmp').innerHTML = sp && mp ? `<div class="sidebyside"><div class="card"><h2>Student needs</h2><dl><dt>Goals</dt><dd>${esc(sp.goals || 'not added yet')}</dd><dt>Skills</dt><dd>${esc(sp.skills || '-')}</dd><dt>Expertise wanted</dt><dd>${esc(sp.expertise || '-')}</dd><dt>Format and duration</dt><dd>${esc(sp.format || '-')} · ${esc(sp.duration || '-')}</dd><dt>Availability</dt><dd>${esc(sp.availability || '-')}</dd></dl></div>
      <div class="card"><h2>Mentor offer</h2><dl><dt>Qualifications</dt><dd>${esc(mp.qualifications || '-')} · ${esc(mp.experience)} yrs</dd><dt>Expertise</dt><dd>${esc(mp.expertise || '-')}</dd><dt>Bio</dt><dd>${esc(mp.bio || '-')}</dd><dt>Availability</dt><dd>${esc(slotText(d, mid))}</dd></dl></div></div>` : '';
  };
  document.getElementById('s').onchange = document.getElementById('m').onchange = compare; compare();
  document.getElementById('f').onsubmit = e => {
    e.preventDefault(); const x = load(), sid = +document.getElementById('s').value, mid = +document.getElementById('m').value, err = document.getElementById('err');
    if (!sid || !mid) return err.textContent = 'Choose a student and a verified mentor.';
    if (x.matches.some(m => m.studentId === sid && ['proposed', 'active'].includes(m.status))) return err.textContent = 'This student already has an open match.';
    const m = { id: id(x), studentId: sid, mentorId: mid, status: 'proposed', notes: document.getElementById('n').value.trim(), proposedAt: new Date().toISOString(), mentorResponse: 'pending', studentResponse: 'pending', mentorRespondedAt: null, studentRespondedAt: null, confirmedAt: null, log: [{ from: '-', to: 'proposed', at: new Date().toISOString(), by: u.name }] };
    x.matches.push(m); notify(x, mid, 'A new student match is waiting for your response.'); notify(x, sid, 'A mentor has been proposed for you. Please accept or decline.'); save(x); toast('Match proposed'); draw();
  };
  app.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { const x = load(); if (setStatus(x, x.matches.find(m => m.id === +b.dataset.ok), 'active', u.name)) { save(x); toast('Match confirmed'); } draw(); });
  app.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { const x = load(); setStatus(x, x.matches.find(m => m.id === +b.dataset.no), 'cancelled', u.name); save(x); toast('Match cancelled'); draw(); });
  app.querySelectorAll('[data-m]').forEach(sel => sel.onchange = () => { if (!sel.value) return; const x = load(); setStatus(x, x.matches.find(m => m.id === +sel.dataset.m), sel.value, u.name); save(x); toast('Status updated'); draw(); });
}
draw();
</script></body></html>
