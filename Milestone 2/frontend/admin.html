<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinator overview · Mentor Connect</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"></main><script src="app.js"></script><script>const u = guard('admin'), app = document.getElementById('app');
function draw() {
  const d = load(), count = s => d.matches.filter(m => m.status === s).length;
  const ready = d.matches.filter(m => m.status === 'proposed' && bothAccepted(m)), declined = d.matches.filter(m => m.status === 'proposed' && (m.mentorResponse === 'declined' || m.studentResponse === 'declined'));
  const delayed = d.matches.filter(m => m.status === 'proposed' && Date.now() - new Date(m.proposedAt) > 3 * 864e5);
  const open = d.concerns.filter(c => c.status === 'open'), pend = Object.entries(d.mentors).filter(([, m]) => m.status === 'pending'), waiting = waitingStudents(d);
  const card = (n, label, href, cta) => `<div class="stat alert ${n ? '' : 'zero'}"><div class="metric">${n}</div><div class="lbl">${label}</div>${n ? `<a href="${href}">${cta}</a>` : ''}</div>`;
  app.innerHTML = `<div class="eyebrow">Coordinator</div><h1>Overview</h1><p class="muted">What needs your attention first, then the recommended matches.</p>
  <section class="stats">${card(ready.length, 'matches ready to confirm', 'admin-matches.html', 'confirm')}${card(declined.length, 'proposals declined by a side', 'admin-matches.html', 'decide')}${card(pend.length, 'mentors to verify', 'admin-mentors.html', 'review')}${card(waiting.length, 'students waiting for a match', 'admin-matches.html', 'match')}${card(open.length, 'open concerns', '#concerns', 'resolve')}</section>
  <div class="card"><h2>Recommended matches</h2><p class="muted">Best mentor for each waiting student, scored out of 100. <a href="admin-matches.html">See top 3 and more</a></p>${recoHtml(d, 1)}</div>
  <section class="grid"><div class="card"><h2>Mentor capacity</h2><ul class="list">${Object.keys(d.mentors).map(Number).map(mid => `<li><b>${esc(userName(d, mid))}</b> ${pill(d.mentors[mid].status)}<br>${capBar(d, mid)}</li>`).join('')}</ul></div>
  <div class="card"><h2>Pipeline</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0">${['proposed', 'active', 'completed', 'cancelled'].map(s => `<div>${pill(s)}<div class="metric">${count(s)}</div></div>`).join('')}</div><p class="muted">${d.users.filter(x => x.role === 'student').length} student profiles · ${Object.keys(d.mentors).length} mentor profiles${delayed.length ? ` · ${delayed.length} proposal(s) waiting more than 3 days` : ''}</p></div></section>
  <section class="grid"><div class="card" id="concerns"><h2>Open concerns</h2><ul class="list">${open.map(c => `<li>${esc(userName(d, c.raisedBy))}: ${esc(c.text)}<div class="actions"><button class="btn small" data-c="${c.id}">Mark resolved</button></div></li>`).join('') || '<li class="muted">No open concerns.</li>'}</ul></div>
  <div class="card"><h2>Student feedback</h2><ul class="list">${d.feedback.slice(-5).reverse().map(f => { const m = d.matches.find(y => y.id === f.matchId); return `<li><b>${f.rating}/5</b> · ${esc(userName(d, f.authorId))} about ${esc(m ? userName(d, m.mentorId) : 'a mentor')}<br><span class="muted">${esc(f.comments || 'No comment')} · ${when(f.at)}</span></li>`; }).join('') || '<li class="muted">No feedback yet.</li>'}</ul></div></section>
  <div class="card"><h2>Recent notifications</h2><ul class="list">${d.notifications.filter(n => n.userId === u.id).slice(-5).reverse().map(n => `<li>${esc(n.text)} <span class="muted">· ${when(n.at)}</span></li>`).join('') || '<li class="muted">None.</li>'}</ul></div>`;
  bindReco(app, draw, u.name);
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const x = load(); x.concerns.find(c => c.id === +b.dataset.c).status = 'resolved'; save(x); toast('Concern resolved'); draw(); });
}
draw();
</script></body></html>
