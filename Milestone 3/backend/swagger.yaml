      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: object, properties: { topic: { type: string }, score: { type: integer }, level: { type: string, enum: [beginner, intermediate, advanced] }, taken_at: { type: string, format: date-time } } }
